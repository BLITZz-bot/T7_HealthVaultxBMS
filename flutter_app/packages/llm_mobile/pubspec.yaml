name: llm_mobile
description: "Mobile-only Flutter plugin wrapping llm_llamacpp for Android and iOS inference in T7 HealthVault."
publish_to: 'none'
version: 0.0.1

environment:
  sdk: ^3.12.2
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  llm_llamacpp: ^0.7.0

flutter:
  plugin:
    platforms:
      android:
        dartPluginClass: LlmMobilePlugin
      ios:
        dartPluginClass: LlmMobilePlugin
